name: "US High-Risk Protest (2026)"
description: "Comprehensive threat profile for high-risk urban protests with active federal surveillance"
version: "1.0"
last_updated: "2026-01-25"
regions: ["US"]
contexts: ["urban_protests", "civil_disobedience", "mass_demonstrations"]

capabilities:
  - id: "facial_recognition_deployed"
    name: "Facial Recognition & LPR"
    severity: "high"
    description: "Flock Safety cameras, DHS facial recognition, drone surveillance active in protest zones"
    sources:
      - title: "Flock Safety Camera Networks Expand"
        url: "https://www.eff.org/deeplinks/2023/10/flock-safety-threatens-expand-dangerous-reach-license-plate-readers"
        author: "EFF"
        date: "2023-10-15"
      - title: "CBP Drone Surveillance of Protests"
        url: "https://www.aclu.org/news/privacy-technology/cbp-flew-a-predator-drone-over-minneapolis"
        author: "ACLU"
        date: "2020-05-29"
    mitigations:
      - id: "face_obscuring"
        action: "avoid_masks_illegal_check_local"
        description: "Check local mask-ban laws; wear glasses/hat/non-reflective materials where legal"
        difficulty: "trivial"
        effectiveness: "medium"
      - id: "pre_event_camera_mapping"
        action: "download_flock_map"
        description: "Identify Flock camera locations before attending; plan routes avoiding cameras"
        difficulty: "easy"
        effectiveness: "high"
        resource: "https://www.vice.com/en/article/flock-safety-cameras-map/"
      - id: "legal_know_rights"
        action: "memorize_legal_contact"
        description: "Memorize lawyer/bail-fund number; do not unlock device if arrested"
        difficulty: "trivial"
        effectiveness: "high"
      - id: "ir_blocking"
        action: "wear_ir_blocking_glasses"
        description: "Consider IR-blocking glasses to defeat night vision facial recognition"
        difficulty: "medium"
        effectiveness: "medium"

  - id: "geofence_warrants"
    name: "Geofence Warrants"
    severity: "high"
    description: "Google Timeline / Apple Location History warrants for bulk protest area data"
    sources:
      - title: "ACLU on Geofence Warrants"
        url: "https://www.aclu.org/news/privacy-technology/geofence-warrants-threaten-civil-liberties"
        author: "ACLU"
        date: "2025-06-01"
      - title: "Google Geofence Data Requests"
        url: "https://www.eff.org/deeplinks/2019/04/googles-sensorvault-can-tell-police-where-youve-been"
        author: "EFF"
        date: "2019-04-15"
    mitigations:
      - id: "disable_location_services"
        action: "disable_location"
        description: "Turn off location services on phone before leaving home"
        difficulty: "trivial"
        effectiveness: "high"
        os: ["android", "ios"]
      - id: "no_google_maps"
        action: "use_offline_maps"
        description: "Download maps offline (Maps.me, Organic Maps); avoid Google Maps near event"
        difficulty: "easy"
        effectiveness: "high"
      - id: "disable_wifi_bluetooth"
        action: "disable_radios"
        description: "Turn off WiFi and Bluetooth to prevent location triangulation"
        difficulty: "trivial"
        effectiveness: "high"
        os: ["android", "ios"]
      - id: "burner_phone"
        action: "use_burner_device"
        description: "Consider using a prepaid burner phone with no Google/Apple account"
        difficulty: "medium"
        effectiveness: "critical"

  - id: "social_media_monitoring"
    name: "Social Media Monitoring & Dataminr"
    severity: "medium"
    description: "Real-time monitoring of protest-related posts, hashtags, past accounts; Dataminr alerts to law enforcement"
    sources:
      - title: "Dataminr Protest Monitoring"
        url: "https://theintercept.com/2020/07/09/twitter-dataminr-police-spy-surveillance-black-lives-matter-protests/"
        author: "The Intercept"
        date: "2020-07-09"
    mitigations:
      - id: "separate_accounts"
        action: "create_separate_activism_account"
        description: "Use separate social media accounts for activism; never link to real identity"
        difficulty: "easy"
        effectiveness: "high"
      - id: "delete_old_posts"
        action: "archive_sensitive_history"
        description: "Delete or archive old posts revealing politics, location, associates"
        difficulty: "medium"
        effectiveness: "medium"
      - id: "avoid_face_photos"
        action: "no_face_in_posts"
        description: "Never post photos with your face before/during/after events"
        difficulty: "trivial"
        effectiveness: "high"
      - id: "delay_posting"
        action: "post_after_event"
        description: "Wait 24-48 hours after event before posting any content"
        difficulty: "easy"
        effectiveness: "high"

  - id: "device_seizure_risk"
    name: "Device Seizure at Arrest"
    severity: "high"
    description: "Phones seized and forensically accessed; unlocked devices reveal chats, locations, contacts"
    sources:
      - title: "Cellebrite and Law Enforcement"
        url: "https://www.aclu.org/issues/privacy-technology/surveillance-technologies/cell-phone-location-tracking"
        author: "ACLU"
        date: "2025-09-15"
      - title: "EFF Know Your Rights"
        url: "https://www.eff.org/issues/know-your-rights"
        author: "EFF"
        date: "2025-01-01"
    mitigations:
      - id: "strong_passcode"
        action: "set_strong_passcode_6plus"
        description: "Set 6+ digit PIN passcode (not biometric); do NOT unlock on arrest"
        difficulty: "trivial"
        effectiveness: "high"
        os: ["android", "ios"]
      - id: "disable_biometrics"
        action: "disable_face_fingerprint"
        description: "Turn off Face ID / fingerprint; use passcode only (harder to force)"
        difficulty: "trivial"
        effectiveness: "high"
        os: ["android", "ios"]
      - id: "signal_pin_wipe"
        action: "enable_signal_pin_remote_wipe"
        description: "Set Signal PIN; enable chat backup password; consider remote wipe if captured"
        difficulty: "medium"
        effectiveness: "high"
      - id: "leave_phone_home"
        action: "faraday_or_home"
        description: "Leave phone at home or in a Faraday bag; attend event without tracking device"
        difficulty: "easy"
        effectiveness: "critical"
      - id: "encrypted_notes"
        action: "use_encrypted_notes"
        description: "Store sensitive info in encrypted apps like Standard Notes or encrypted Signal notes"
        difficulty: "easy"
        effectiveness: "high"

  - id: "network_interception"
    name: "Network Interception (IMSI, Bluetooth, DPI)"
    severity: "medium"
    description: "IMSI catchers (Stingrays), Bluetooth scanners, deep packet inspection in protest zones"
    sources:
      - title: "IMSI Catchers in US Law Enforcement"
        url: "https://www.eff.org/pages/cell-site-simulatorsimsi-catchers"
        author: "EFF"
        date: "2025-08-20"
    mitigations:
      - id: "airplane_mode"
        action: "airplane_mode_during_event"
        description: "Enable airplane mode during protest to block IMSI/Bluetooth scraping"
        difficulty: "trivial"
        effectiveness: "high"
      - id: "bluetooth_off"
        action: "disable_bluetooth"
        description: "Turn off Bluetooth; proximity attacks via BLE possible"
        difficulty: "trivial"
        effectiveness: "high"
      - id: "tor_browser_coordination"
        action: "use_tor_for_planning"
        description: "Use Tor Browser for protest coordination/research; avoids ISP-level inspection"
        difficulty: "easy"
        effectiveness: "high"
      - id: "signal_calls"
        action: "use_signal_for_calls"
        description: "Use Signal for voice calls; encrypted end-to-end, not interceptable by Stingray"
        difficulty: "easy"
        effectiveness: "high"

  - id: "informants_infiltration"
    name: "Informants & Infiltration"
    severity: "medium"
    description: "Undercover officers and paid informants may infiltrate protest groups"
    sources:
      - title: "FBI Infiltration of Activist Groups"
        url: "https://www.aclu.org/issues/national-security/privacy-and-surveillance/surveillance-activists"
        author: "ACLU"
        date: "2024-03-15"
    mitigations:
      - id: "need_to_know"
        action: "limit_information_sharing"
        description: "Share sensitive plans only with trusted, vetted individuals"
        difficulty: "medium"
        effectiveness: "high"
      - id: "public_actions"
        action: "keep_actions_legal"
        description: "Avoid discussing illegal actions; assume conversations may be monitored"
        difficulty: "easy"
        effectiveness: "high"
      - id: "security_culture"
        action: "practice_security_culture"
        description: "Learn and practice security culture; don't ask what you don't need to know"
        difficulty: "medium"
        effectiveness: "high"
        resource: "https://crimethinc.com/2004/11/01/what-is-security-culture"

countermeasures:
  browser_profile:
    name: "Firefox Hardened Profile"
    description: "Create separate Firefox profile with privacy-focused defaults for activism research"
    settings:
      - "privacy.trackingprotection.enabled=true"
      - "privacy.trackingprotection.socialtracking.enabled=true"
      - "network.cookie.cookieBehavior=1"
      - "dom.disable_beforeunload=true"
      - "media.peerconnection.enabled=false"
      - "geo.enabled=false"
      - "browser.safebrowsing.malware.enabled=false"
      - "browser.safebrowsing.phishing.enabled=false"
      - "network.dns.disablePrefetch=true"
      - "network.prefetch-next=false"
    extensions:
      - name: "uBlock Origin"
        description: "Block ads, trackers, malware"
        url: "https://addons.mozilla.org/firefox/addon/ublock-origin/"
      - name: "NoScript"
        description: "Block JavaScript except on trusted sites"
        url: "https://addons.mozilla.org/firefox/addon/noscript/"
      - name: "Decentraleyes"
        description: "Block CDN tracking by serving local copies"
        url: "https://addons.mozilla.org/firefox/addon/decentraleyes/"
      - name: "Privacy Badger"
        description: "Automatically learn to block invisible trackers"
        url: "https://addons.mozilla.org/firefox/addon/privacy-badger17/"
    notes: "Use separate profile from daily browsing; clear on exit; consider Tor Browser for sensitive research"

  os_hardening_linux:
    name: "Linux Hardening (UFW, Services)"
    checks:
      - check: "encryption_enabled"
        command: "dmsetup table --showkeys"
        description: "Verify full-disk encryption (LUKS) enabled"
      - check: "ufw_active"
        command: "ufw status"
        description: "Verify UFW firewall is active"
      - check: "fail2ban_active"
        command: "systemctl status fail2ban"
        description: "Verify Fail2Ban is running"
      - check: "ssh_key_only"
        command: "grep PasswordAuthentication /etc/ssh/sshd_config"
        expected: "PasswordAuthentication no"
        description: "Verify SSH password auth is disabled"
    ufw_rules:
      - "sudo ufw default deny incoming"
      - "sudo ufw default allow outgoing"
      - "sudo ufw allow ssh"
      - "sudo ufw enable"
    notes: "Run these on home machine used for coordination; not applicable to mobile devices"

  os_hardening_android:
    name: "Android Hardening"
    checks:
      - check: "encryption_enabled"
        command: "adb shell getprop ro.crypto.state"
        expected: "encrypted"
        description: "Verify device encryption is enabled"
    actions:
      - "Disable biometrics (Settings > Biometrics > Off)"
      - "Set strong 6+ digit PIN passcode"
      - "Disable cloud backup (Settings > Accounts > Google > Backup)"
      - "Disable location services (Settings > Location > Off)"
      - "Turn off Bluetooth and WiFi before leaving home"
      - "Enable airplane mode at protest location"
      - "Install Signal and set disappearing messages"
    notes: "Consider using a burner phone or leaving phone at home entirely"

  network_config:
    name: "Network / VPN / Tor Guidance"
    tor_setup:
      - description: "Use Tor Browser for coordination and research"
        download: "https://www.torproject.org"
        difficulty: "easy"
        effectiveness: "high"
      - description: "Consider Tails OS for maximum anonymity"
        download: "https://tails.boum.org"
        difficulty: "medium"
        effectiveness: "critical"
    circumvention:
      - name: "Mullvad VPN"
        description: "Privacy-focused VPN; accepts cash/crypto; no logs"
        url: "https://mullvad.net"
      - name: "IVPN"
        description: "Audited no-logs VPN; open source clients"
        url: "https://www.ivpn.net"
      - name: "Psiphon"
        description: "Free anti-censorship tool; good for circumventing blocks"
        url: "https://psiphon.ca"
    notes: "Never use free VPNs; they often log and sell data. Test tools before you need them."

legal_notes: |
  - Do NOT unlock your device if arrested; invoke right to remain silent.
  - Say: "I am invoking my right to remain silent. I want a lawyer."
  - Memorize a lawyer's phone number; call immediately upon arrest.
  - Know your rights: EFF & ACLU have pocket guides.
  - Understand local laws on masks, protests, civil disobedience.
  - Data on your phone can be used against you; minimize what you carry.
  - You have the right to record police in public in all 50 states.
  - If police ask to search you, say: "I do not consent to searches."

sources:
  - "https://www.aclu.org/"
  - "https://www.eff.org/"
  - "https://ssd.eff.org/"
  - "https://www.amnesty.org/"

tags: ["us", "2026", "protests", "federal", "high_risk", "urban"]
